<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MK Image Area Selector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h2>MK Image Area Selector</h2>

 <div class="controls">
  <label>Select image from phone:</label>
  <input type="file" id="imageInput" accept="image/*">

  <p>Or paste image URL from Chrome:</p>

  <input
    type="url"
    id="imageUrl"
    placeholder="Paste image URL here"
  >

  <button id="loadUrlBtn">Load Image</button>
</div>

  <div id="box">
    <img id="mainImg" alt="Your image">
    <div id="marker">
      <span class="handle tl"></span>
      <span class="handle tr"></span>
      <span class="handle bl"></span>
      <span class="handle br"></span>
    </div>
  </div>

  <h3>Generated CSS</h3>
  <pre id="output">Image load karke area select karo.</pre>

  <button id="copyBtn">Copy CSS</button>
  <button id="resetBtn">Reset</button>

  <script src="script.js"></script>
</body>
</html>
